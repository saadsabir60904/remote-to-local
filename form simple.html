<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form simple</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
    <h1 class="Display-1 text-center text-danger fw-bold">EMAIL SUBMISSION</h1>
    <form>
        <div class="m-3">
            <label class="form-label fw-bold">EMAIL ADDRESS</label>
            <input type="email" class="form-control" aria-describedby="emailHelp" style="height: 35px; width: 270px;">
            <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
        </div>

        <div class="m-3">
            <label class="form-label fw-bold">PASSWORD</label>
            <input type="password" class="form-control" style="height: 35px; width: 270px;">
        </div>

        <div class="m-3 form-check">
            <input type="checkbox" class="form-check-input" id="exampleCheck1">
            <label class="form-check-label ">CHECK ME OUT</label>
        </div>
        <button type="submit" class="btn btn-primary m-3 fw-bold btn-warning">SUBMIT</button>
    </form>
</body>
</html>
